<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Đăng nhập • Flash Sale</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:
        radial-gradient(
          circle at top left,
          #263b73 0,
          #111827 38%,
          #080b12 100%
        );

      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      padding: 24px;
    }

    .login-wrapper {
      width: 100%;
      max-width: 430px;
    }

    .brand {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 14px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 18px;

      background: linear-gradient(
        135deg,
        #667eea,
        #764ba2
      );

      font-size: 30px;

      box-shadow:
        0 15px 40px rgba(0, 0, 0, .35);
    }

    .brand h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -.5px;
    }

    .brand p {
      margin: 8px 0 0;
      color: #aeb7c8;
      font-size: 14px;
    }

    .login-card {
      background: rgba(17, 24, 39, .88);

      border: 1px solid rgba(255, 255, 255, .08);

      border-radius: 20px;

      padding: 32px;

      box-shadow:
        0 25px 70px rgba(0, 0, 0, .45);

      backdrop-filter: blur(16px);
    }

    .login-card h2 {
      margin: 0 0 6px;
      font-size: 22px;
    }

    .login-description {
      margin: 0 0 26px;
      color: #9ca3af;
      font-size: 14px;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;

      font-size: 13px;
      font-weight: 600;
      color: #d1d5db;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper input {
      width: 100%;

      padding: 13px 14px;

      border-radius: 10px;

      border: 1px solid #374151;

      background: #111827;

      color: #fff;

      outline: none;

      font-size: 14px;

      transition: .2s;
    }

    .input-wrapper input:focus {
      border-color: #667eea;

      box-shadow:
        0 0 0 3px rgba(102, 126, 234, .15);
    }

    .password-toggle {
      position: absolute;

      right: 10px;
      top: 50%;

      transform: translateY(-50%);

      border: 0;
      background: transparent;

      color: #9ca3af;

      cursor: pointer;

      padding: 5px;
    }

    .password-toggle:hover {
      color: #fff;
    }

    .login-button {
      width: 100%;

      margin-top: 8px;

      padding: 13px 16px;

      border: 0;
      border-radius: 10px;

      background:
        linear-gradient(
          135deg,
          #667eea,
          #764ba2
        );

      color: #fff;

      font-size: 15px;
      font-weight: 700;

      cursor: pointer;

      transition: .2s;

      box-shadow:
        0 10px 25px rgba(102, 126, 234, .25);
    }

    .login-button:hover {
      transform: translateY(-1px);

      box-shadow:
        0 14px 30px rgba(102, 126, 234, .35);
    }

    .login-button:disabled {
      opacity: .6;
      cursor: not-allowed;
      transform: none;
    }

    .error-message {
      display: none;

      margin-bottom: 18px;

      padding: 11px 13px;

      border-radius: 9px;

      background: rgba(239, 68, 68, .1);

      border: 1px solid rgba(239, 68, 68, .25);

      color: #fca5a5;

      font-size: 13px;
    }

    .error-message.show {
      display: block;
    }

    .demo-account {
      margin-top: 22px;

      padding: 13px;

      border-radius: 10px;

      background: rgba(255, 255, 255, .04);

      border: 1px solid rgba(255, 255, 255, .06);

      font-size: 12px;

      color: #9ca3af;
    }

    .demo-account strong {
      color: #d1d5db;
    }

    .footer {
      text-align: center;

      margin-top: 20px;

      color: #6b7280;

      font-size: 12px;
    }

    .loading {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .spinner {
      width: 15px;
      height: 15px;

      border: 2px solid rgba(255, 255, 255, .3);
      border-top-color: #fff;

      border-radius: 50%;

      animation: spin .7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 24px;
      }

      .brand h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <main class="login-wrapper">

    <section class="brand">
      <div class="brand-icon">
        ⚡
      </div>

      <h1>Flash Sale System</h1>

      <p>
        Đăng nhập để tiếp tục
      </p>
    </section>


    <section class="login-card">

      <h2>Đăng nhập</h2>

      <p class="login-description">
        Sử dụng tài khoản Flash Sale của bạn.
      </p>


      <div id="error-message" class="error-message"></div>


      <form id="login-form">

        <div class="field">

          <label for="username">
            Username hoặc Email
          </label>

          <div class="input-wrapper">

            <input
              id="username"
              name="username"
              type="text"
              placeholder="admin hoặc admin@flashsale.local"
              autocomplete="username"
              required
            >

          </div>

        </div>


        <div class="field">

          <label for="password">
            Mật khẩu
          </label>

          <div class="input-wrapper">

            <input
              id="password"
              name="password"
              type="password"
              placeholder="Nhập mật khẩu"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="password-toggle"
              id="toggle-password"
            >
              Hiện
            </button>

          </div>

        </div>


        <button
          id="login-button"
          class="login-button"
          type="submit"
        >
          Đăng nhập
        </button>

      </form>


      <div class="demo-account">

        <strong>Tài khoản Admin demo</strong>

        <br>

        Username:
        <strong>admin</strong>

        <br>

        Password:
        <strong>Admin@123</strong>

      </div>

    </section>


    <div class="footer">
      Flash Sale System • JWT Authentication
    </div>

  </main>


 <script src="/js/common.js"></script>
<script src="/js/login.js"></script>

</body>
</html>
